id: io.github.kovzol.bibref
runtime: org.kde.Platform
runtime-version: '6.10'
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
sdk: org.kde.Sdk
command: bibref-qt
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --system-talk-name=org.freedesktop.UDisks2
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: sword
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSWORD_BUILD_UTILS=No
      - -DSWORD_BUILD_EXAMPLES=No
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DSWORD_LINK_LIBRARIES="curl"
    cleanup:
      - /bin/*
    sources:
      - type: archive
        url: https://www.crosswire.org/ftpmirror/pub/sword/source/v1.9/sword-1.9.0.tar.gz
        sha256: 42409cf3de2faf1108523e2c5ac0745d21f9ed2a5c78ed878ee9dcc303426b8a
        x-checker-data:
          type: anitya
          project-id: 16287
          url-template: https://www.crosswire.org/ftpmirror/pub/sword/source/v${version0}.${version1}/sword-$version.tar.gz

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=system,filesystem
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz
        sha256: c4a3b310ddd2472416e091067166b0713be97c63f38c212c484ada022fd296ce
        x-checker-data:
          type: anitya
          project-id: 6845
          url-template: https://archives.boost.io/release/$version/source/boost_${version0}_${version1}_${version2}.tar.gz

  - name: graphviz
    cleanup:
      - /share/man
      - /share/graphviz
      - /share/doc/graphviz
      - /bin/*
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.0/graphviz-16.1.0.tar.gz
        sha256: beea483ab130f456c1c3905f4f2e40778a9c493c3d73ae8012367d552d71ca84
        x-checker-data:
          type: anitya
          project-id: 1249
          url-template: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/$version/graphviz-$version.tar.gz

  - name: bibref-qt
    buildsystem: cmake-ninja
    subdir: qt
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_SHARED_LIBS=ON
      - -UPROJECT_SOURCE_DIR
      - -DPROJECT_SOURCE_DIR=/app/share/bibref-qt
      - -DWEBENGINE=ON
    # The cmake machinery will put the required databases in $XDG_DATA_HOME (if it is set).
    # By setting that value we put the database to /app/tmp/.sword temporarily
    # and later we copy it to /app/share/sword in the post-install step:
    build-options:
      env:
        XDG_DATA_HOME: /app/tmp
    sources:
      # - type: git
      # url: https://github.com/kovzol/bibref
      # tag: 2026-10-19 # does not yet exist
      - type: archive
        url: https://github.com/kovzol/bibref/archive/2930776f2d75236163bc708c2b25a6b1b522c7fb.zip
        sha256: 40f1e4fd55ffeb9c352bcb04db2dbc2dad0c4ade3ec20d965cd3e0ae8ed45f87
    post-install:
      - mv /app/tmp/.sword/* /app/share/sword
